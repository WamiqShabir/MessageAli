<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Ali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #050508;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.13) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 28px 20px 20px;
      backdrop-filter: blur(24px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      height: 80vh;
      max-height: 720px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #ffffff 0%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #71717a;
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    /* Code Section */
    #codeSection {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    #code {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      font-size: 1.5rem;
      color: white;
      text-align: center;
      letter-spacing: 10px;
      outline: none;
      margin-bottom: 16px;
    }

    #code:focus {
      border-color: rgba(59, 130, 246, 0.55);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }

    /* Chat Section */
    #chatSection {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 4px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.received {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.2);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.sent {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message .time {
      font-size: 0.7rem;
      color: #71717a;
      margin-top: 4px;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px 14px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }

    #messageInput:focus {
      border-color: rgba(59, 130, 246, 0.5);
    }

    #sendBtn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }

    #sendBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      font-size: 0.85rem;
      color: #a1a1aa;
      margin-top: 10px;
      min-height: 20px;
    }

    .status.success { color: #34d399; }
    .status.error { color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Message Ali</h1>
      <p class="subtitle" id="subtitle">Enter the access code</p>

      <!-- Code Section -->
      <div id="codeSection">
        <input type="password" id="code" placeholder="••••" maxlength="8" autocomplete="off" autofocus>
        <div class="status" id="codeStatus"></div>
      </div>

      <!-- Chat Section -->
      <div id="chatSection">
        <div id="messages"></div>

        <div class="input-area">
          <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
          <button id="sendBtn">Send</button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>
  </div>

  <script>
    const TOPIC = "MessageAli-2525-123";
    const CORRECT_CODE = "2525";

    const codeInput = document.getElementById("code");
    const codeSection = document.getElementById("codeSection");
    const chatSection = document.getElementById("chatSection");
    const messagesDiv = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const status = document.getElementById("status");
    const codeStatus = document.getElementById("codeStatus");
    const subtitle = document.getElementById("subtitle");

    let eventSource = null;

    // Check code
    codeInput.addEventListener("input", () => {
      if (codeInput.value === CORRECT_CODE) {
        codeSection.style.display = "none";
        chatSection.style.display = "flex";
        subtitle.textContent = "Connected";
        codeStatus.textContent = "";
        messageInput.focus();
        startListening();
      }
    });

    // Start listening for incoming messages (from phone)
    function startListening() {
      if (eventSource) eventSource.close();

      // Using ntfy Server-Sent Events
      eventSource = new EventSource(`https://ntfy.sh/${TOPIC}/sse`);

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          // Ignore our own messages if needed, or show everything
          if (data.event === "message" && data.message) {
            addMessage(data.message, "received");
          }
        } catch (e) {
          console.log("Parse error", e);
        }
      };

      eventSource.onerror = () => {
        // Auto reconnect is handled by the browser mostly
        console.log("SSE connection error - will retry");
      };
    }

    // Send message
    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    async function sendMessage() {
      const msg = messageInput.value.trim();
      if (!msg) return;

      sendBtn.disabled = true;
      status.textContent = "Sending...";

      try {
        const res = await fetch(`https://ntfy.sh/${TOPIC}`, {
          method: "POST",
          body: msg,
          headers: {
            "Title": "Message Ali",
            "Priority": "high",
            "Tags": "speech_balloon"
          }
        });

        if (res.ok) {
          addMessage(msg, "sent");
          messageInput.value = "";
          status.textContent = "";
        } else {
          throw new Error();
        }
      } catch (e) {
        status.textContent = "Failed to send";
        status.className = "status error";
      }

      sendBtn.disabled = false;
      messageInput.focus();
    }

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = `message ${type}`;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      div.innerHTML = `
        ${escapeHtml(text)}
        <div class="time">${time}</div>
      `;

      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
