<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Message Ali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #050508;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      width: 120vw;
      height: 120vw;
      max-width: 600px;
      max-height: 600px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.16) 0%, transparent 70%);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 860px;
      display: flex;
      flex-direction: column;
    }
    .card {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 24px;
      padding: 20px 16px 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
      flex-shrink: 0;
    }
    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .subtitle {
      color: #71717a;
      font-size: 0.88rem;
    }
    #codeSection {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 20px 8px;
    }
    #code {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 18px 16px;
      font-size: 1.6rem;
      color: white;
      text-align: center;
      letter-spacing: 12px;
      outline: none;
      transition: all 0.2s ease;
    }
    #code:focus {
      border-color: rgba(59, 130, 246, 0.6);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }
    #chatSection {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 4px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }
    #messages::-webkit-scrollbar {
      width: 4px;
    }
    #messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }
    .message {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-wrap: break-word;
      animation: messageIn 0.25s ease;
    }
    @keyframes messageIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.received {
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.22);
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }
    .message.sent {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.12);
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }
    .message .time {
      font-size: 0.68rem;
      color: #71717a;
      margin-top: 5px;
      text-align: right;
    }
    .message.received .time {
      text-align: left;
    }
    .input-area {
      display: flex;
      gap: 10px;
      padding-top: 8px;
      flex-shrink: 0;
    }
    #messageInput {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 14px 16px;
      color: white;
      font-size: 1rem;
      outline: none;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    #messageInput:focus {
      border-color: rgba(59, 130, 246, 0.55);
      background: rgba(255, 255, 255, 0.08);
    }
    #sendBtn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 0 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 72px;
    }
    #sendBtn:active {
      transform: scale(0.97);
    }
    #sendBtn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .status {
      text-align: center;
      font-size: 0.82rem;
      color: #a1a1aa;
      margin-top: 8px;
      min-height: 18px;
      flex-shrink: 0;
    }
    @media (max-width: 480px) {
      body {
        padding: 0;
      }
      .container {
        max-height: 100%;
        height: 100%;
      }
      .card {
        border-radius: 0;
        border-left: none;
        border-right: none;
        height: 100%;
        max-height: 100%;
      }
      h1 {
        font-size: 1.4rem;
      }
    }
    @media (min-width: 768px) {
      .card {
        border-radius: 28px;
        padding: 28px 24px 20px;
      }
      h1 {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1>Message Ali</h1>
        <p class="subtitle" id="subtitle">Enter the access code</p>
      </div>
      <div id="codeSection">
        <input type="password" id="code" placeholder="••••" maxlength="8" autocomplete="off" autofocus inputmode="numeric">
      </div>
      <div id="chatSection">
        <div id="messages"></div>
        <div class="input-area">
          <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
          <button id="sendBtn">Send</button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>
  </div>
  <script>
    const TOPIC = "MessageAli-2525-123";
    const CORRECT_CODE = "2525";
    const STORAGE_KEY = "messageAli_history_" + TOPIC;

    const codeInput = document.getElementById("code");
    const codeSection = document.getElementById("codeSection");
    const chatSection = document.getElementById("chatSection");
    const messagesDiv = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const status = document.getElementById("status");
    const subtitle = document.getElementById("subtitle");

    let eventSource = null;
    let pendingSent = new Set();          // text of messages we just sent
    let knownIds = new Set();             // ntfy message ids we already showed
    let history = [];                     // { id, text, type, time }

    // ---------- localStorage helpers ----------
    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) history = JSON.parse(raw);
        else history = [];
      } catch (e) {
        history = [];
      }
      // rebuild knownIds
      knownIds = new Set(history.filter(m => m.id).map(m => m.id));
    }

    function saveHistory() {
      try {
        // keep last ~200 messages to avoid huge storage
        if (history.length > 200) history = history.slice(-200);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      } catch (e) {}
    }

    // ---------- UI helpers ----------
    function addMessage(text, type, timeStr, id, save = true) {
      if (id && knownIds.has(id)) return; // already shown
      if (id) knownIds.add(id);

      const div = document.createElement("div");
      div.className = `message ${type}`;
      const time = timeStr || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      div.innerHTML = `
        ${escapeHtml(text)}
        <div class="time">${time}</div>
      `;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      if (save) {
        history.push({
          id: id || null,
          text,
          type,
          time
        });
        saveHistory();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function renderHistory() {
      messagesDiv.innerHTML = "";
      for (const m of history) {
        addMessage(m.text, m.type, m.time, m.id, false);
      }
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // ---------- code gate ----------
    codeInput.addEventListener("input", () => {
      if (codeInput.value === CORRECT_CODE) {
        codeSection.style.display = "none";
        chatSection.style.display = "flex";
        subtitle.textContent = "Connected";
        messageInput.focus();
        startListening();
      }
    });

    // ---------- start chat ----------
    async function startListening() {
      loadHistory();
      renderHistory();

      // 1) Fetch recent messages from ntfy cache (last ~12 h)
      status.textContent = "Loading history...";
      try {
        const res = await fetch(`https://ntfy.sh/${TOPIC}/json?poll=1&since=all`);
        if (res.ok) {
          const text = await res.text();
          const lines = text.trim().split("\n").filter(Boolean);
          for (const line of lines) {
            try {
              const data = JSON.parse(line);
              if (data.event === "message" && data.message) {
                // messages from cache that we don't already have
                if (!data.id || !knownIds.has(data.id)) {
                  // try to guess if it was one we sent earlier (same text still in pending is rare)
                  const type = pendingSent.has(data.message) ? "sent" : "received";
                  if (pendingSent.has(data.message)) pendingSent.delete(data.message);

                  const timeStr = data.time
                    ? new Date(data.time * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    : undefined;
                  addMessage(data.message, type, timeStr, data.id);
                }
              }
            } catch (e) {}
          }
        }
      } catch (e) {
        // ignore – we still have local history
      }
      status.textContent = "";

      // 2) Live SSE stream
      if (eventSource) eventSource.close();
      eventSource = new EventSource(`https://ntfy.sh/${TOPIC}/sse`);

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.event === "message" && data.message) {
            if (data.id && knownIds.has(data.id)) return;

            if (pendingSent.has(data.message)) {
              pendingSent.delete(data.message);
              const timeStr = data.time
                ? new Date(data.time * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                : undefined;
              addMessage(data.message, "sent", timeStr, data.id);
            } else {
              const timeStr = data.time
                ? new Date(data.time * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                : undefined;
              addMessage(data.message, "received", timeStr, data.id);
            }
          }
        } catch (e) {}
      };

      eventSource.onerror = () => {
        // EventSource will auto-reconnect
      };
    }

    // ---------- send ----------
    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const msg = messageInput.value.trim();
      if (!msg) return;

      sendBtn.disabled = true;
      status.textContent = "Sending...";
      pendingSent.add(msg);

      try {
        const res = await fetch(`https://ntfy.sh/${TOPIC}`, {
          method: "POST",
          body: msg,
          headers: {
            "Title": "Message Ali",
            "Priority": "high",
            "Tags": "speech_balloon"
          }
        });

        if (!res.ok) throw new Error();

        // optionally parse the returned message object to get its id early
        try {
          const data = await res.json();
          if (data && data.id) {
            // we already know the id, mark it so SSE doesn't duplicate
            knownIds.add(data.id);
          }
        } catch (e) {}

        messageInput.value = "";
        status.textContent = "";
      } catch (e) {
        pendingSent.delete(msg);
        status.textContent = "Failed to send";
      }

      sendBtn.disabled = false;
      messageInput.focus();
    }
  </script>
</body>
</html>
